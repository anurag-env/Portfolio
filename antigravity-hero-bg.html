<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Antigravity-style hero background</title>
<style>
  :root {
    --bg: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }

  .hero {
    position: relative;
    min-height: 100vh;
    width: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }

  /* the canvas IS the background — sits behind everything */
  .hero__bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 0;
  }

  .hero__content {
    position: relative;
    z-index: 1;
    max-width: 900px;
    padding: 0 24px;
    text-align: center;
  }

  .hero__eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #444;
    margin-bottom: 18px;
  }

  .hero__title {
    font-size: clamp(2.1rem, 7vw, 4.6rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    color: #0b0b0e;
    font-weight: 500;
  }

  .hero__actions {
    margin-top: 34px;
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    border: none;
    border-radius: 999px;
    padding: 14px 26px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn--dark { background: #101013; color: #fff; }
  .btn--light { background: #f1f0f4; color: #101013; }

  @media (max-width: 640px) {
    .hero { min-height: 100svh; padding-top: 64px; }
    .hero__title { font-size: clamp(1.8rem, 9vw, 2.6rem); }
    .hero__actions { flex-direction: column; align-items: center; }
    .btn { width: 100%; max-width: 280px; }
  }
</style>
</head>
<body>

<section class="hero">
  <canvas class="hero__bg" id="burst"></canvas>

  <div class="hero__content">
    <div class="hero__eyebrow">Your Brand</div>
    <h1 class="hero__title">Experience liftoff with the<br />next-gen agent platform</h1>
    <div class="hero__actions">
      <button class="btn btn--dark">Download</button>
      <button class="btn btn--light">Explore use cases</button>
    </div>
  </div>
</section>

<script>
/**
 * Radial "confetti burst" background — recreates the Antigravity hero effect.
 *
 * How the real site's effect works (reverse-engineered from the screenshot):
 *  1. A full-bleed canvas sits behind the hero copy, background is plain white.
 *  2. Particles are tiny rounded-cap line segments (not dots), each rotated to
 *     point roughly away from a center origin — like debris flung outward.
 *  3. Density is radial: very sparse near the origin (where the logo/headline
 *     sits) and denser out toward the corners/edges — a burst, not a random field.
 *  4. Color is angle-based: particles are tinted from a palette that sweeps
 *     across the color wheel depending on which direction from center they sit
 *     (blue/purple on one side, pink/red/orange/yellow on the other).
 *  5. Motion is very subtle — a slow drift/parallax, not fast movement — so it
 *     reads as "alive" without competing with the headline.
 *
 * This recreates that with plain <canvas>, no libraries, and scales the
 * particle count down on small screens for performance + so it doesn't
 * overwhelm a mobile hero.
 */
(function () {
  const canvas = document.getElementById('burst');
  const ctx = canvas.getContext('2d');
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Color palette sampled from the screenshot — swap these for your brand.
  const PALETTE = [
    '#5B5BF0', // indigo/blue
    '#8B5CF6', // violet
    '#C026D3', // magenta
    '#EC4899', // pink
    '#F97316', // orange
    '#FACC15'  // yellow
  ];

  let particles = [];
  let w, h, dpr, originX, originY;

  function isMobile() {
    return window.innerWidth < 640;
  }

  function particleCount() {
    // Fewer particles on small / low-power screens.
    const w = window.innerWidth;
    if (w < 480) return 90;
    if (w < 900) return 160;
    return 260;
  }

  function rand(min, max) { return Math.random() * (max - min) + min; }

  function buildParticles() {
    particles = [];
    const count = particleCount();
    // Origin roughly where the wordmark sits on desktop; recentered on mobile.
    originX = isMobile() ? w * 0.5 : w * 0.62;
    originY = isMobile() ? h * 0.28 : h * 0.32;

    const maxDist = Math.hypot(w, h) * 0.75;

    for (let i = 0; i < count; i++) {
      // Bias distance toward the outer edge (sparse near origin, denser far away).
      const t = Math.pow(Math.random(), 0.45); // skews toward 1
      const dist = t * maxDist * rand(0.15, 1.05);
      const angle = rand(0, Math.PI * 2);

      const x = originX + Math.cos(angle) * dist;
      const y = originY + Math.sin(angle) * dist * 0.72; // flatten vertically a touch

      // Color sweeps around the angle, like the reference image.
      const hueT = (angle / (Math.PI * 2) + Math.random() * 0.08) % 1;
      const color = PALETTE[Math.floor(hueT * PALETTE.length) % PALETTE.length];

      particles.push({
        x, y,
        angle,
        len: rand(6, 16),
        thickness: rand(1.4, 2.6),
        color,
        opacity: rand(0.35, 0.9),
        // slow independent drift, used only if motion is allowed
        driftSpeed: rand(0.05, 0.18),
        driftPhase: rand(0, Math.PI * 2)
      });
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth = canvas.parentElement.clientWidth;
    h = canvas.clientHeight = canvas.parentElement.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildParticles();
  }

  function draw(time) {
    ctx.clearRect(0, 0, w, h);

    for (const p of particles) {
      let x = p.x, y = p.y, rot = p.angle;

      if (!prefersReducedMotion) {
        const drift = Math.sin(time * 0.001 * p.driftSpeed + p.driftPhase);
        x += drift * 3;
        y += Math.cos(time * 0.001 * p.driftSpeed + p.driftPhase) * 3;
      }

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.globalAlpha = p.opacity;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.thickness;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-p.len / 2, 0);
      ctx.lineTo(p.len / 2, 0);
      ctx.stroke();
      ctx.restore();
    }

    if (!prefersReducedMotion) {
      requestAnimationFrame(draw);
    }
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
  if (prefersReducedMotion) draw(0); // draw once, static
})();
</script>
</body>
</html>
